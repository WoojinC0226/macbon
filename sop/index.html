<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>맥본 작업표준서(SOP) 생성기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --ink:#1a1d21; --sub:#5b6570; --line:#c8ccd2; --line2:#e4e7eb;
    --bg:#eef1f4; --panel:#ffffff; --accent:#0b6b53; --accent-soft:#e6f2ee;
    --warn:#b4531a; --warn-soft:#fbeee4; --focus:#0b6b53;
    --head:#f3f5f7; --shadow:0 1px 3px rgba(20,30,40,.08),0 6px 24px rgba(20,30,40,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Malgun Gothic","맑은 고딕",-apple-system,"Apple SD Gothic Neo",Pretendard,sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  }
  #root{min-height:100vh;}
  .app{display:grid; grid-template-columns:minmax(420px,520px) 1fr; min-height:100vh;}
  .mobile-tabs{display:none;}
  @media(max-width:1100px){
    .app{grid-template-columns:1fr;}
    .mobile-tabs{display:grid; grid-template-columns:1fr 1fr; position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line);}
    .mobile-tabs button{border:none; background:transparent; padding:13px; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--sub); cursor:pointer; border-bottom:2.5px solid transparent;}
    .mobile-tabs button.on{color:var(--accent); border-bottom-color:var(--accent);}
    .app.tab-form .previewwrap{display:none;}
    .app.tab-preview .panel{display:none;}
    .panel{height:auto; position:static;}
    .brand{position:static;}
  }

  /* ===== Left: form ===== */
  .panel{background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; height:100vh; position:sticky; top:0;}
  @media(max-width:1100px){ .panel{height:auto; position:static; border-right:none; border-bottom:1px solid var(--line);} }
  .brand{padding:14px 20px 12px; border-bottom:1px solid var(--line2); position:sticky; top:0; background:var(--panel); z-index:8;}
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .brand h1{font-size:15px; margin:0; letter-spacing:-.2px; display:flex; align-items:center; gap:8px;}
  .brand .tag{font-size:11px; font-weight:700; color:#fff; background:var(--accent); padding:2px 7px; border-radius:5px; letter-spacing:.3px;}
  .brand .unsaved{font-size:11px; font-weight:700; color:var(--warn); background:var(--warn-soft); padding:2px 8px; border-radius:20px; white-space:nowrap;}
  .toolbar{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .toolbar .btn{flex:1; justify-content:center; min-width:70px;}

  .sect{padding:16px 20px; border-bottom:1px solid var(--line2);}
  .sect > h2{font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--accent); margin:0 0 12px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .sect > h2 .n{display:inline-flex; width:18px; height:18px; align-items:center; justify-content:center; background:var(--accent); color:#fff; border-radius:5px; font-size:11px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .field{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
  .field.full{grid-column:1/-1;}
  label{font-size:11.5px; color:var(--sub); font-weight:600;}
  input[type=text],input[type=date],input[type=number],textarea,select{
    font-family:inherit; font-size:13px; color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:7px; padding:8px 9px; width:100%;
    transition:border-color .12s, box-shadow .12s;
  }
  input:focus,textarea:focus,select:focus{outline:none; border-color:var(--focus); box-shadow:0 0 0 3px var(--accent-soft);}
  textarea{resize:vertical; min-height:60px; line-height:1.45;}

  .btn{font-family:inherit; font-size:12.5px; font-weight:700; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:7px; padding:7px 11px; cursor:pointer; transition:.12s; display:inline-flex; align-items:center; gap:6px;}
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.pri{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.pri:hover{filter:brightness(1.07); color:#fff;}
  .btn.sm{padding:4px 8px; font-size:11.5px;}
  .btn.xs{padding:3px 7px; font-size:11px; line-height:1;}
  .btn.danger{color:#a12; border-color:#e7c9c9;}
  .btn.danger:hover{background:#fbeaea; border-color:#d99;}
  .btn.ghost{border-style:dashed; color:var(--sub); width:100%; justify-content:center; margin-top:6px;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn:disabled:hover{border-color:var(--line); color:var(--ink);}

  .req{color:#c0392b; font-weight:900;}
  input.warn-empty{border-color:#e0b4b4; background:#fdf7f7;}
  .mini{font-size:10px; color:#98a0a8; font-weight:400;}

  .sect-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .sect-head h2{margin:0;}
  .toggle{font-size:11.5px; color:var(--sub); display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none; font-weight:600;}
  .toggle input{width:auto; margin:0; accent-color:var(--accent);}
  .rowbtns{display:flex; gap:4px;}

  /* preset chips */
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;}
  .chip{font-size:11px; padding:3px 8px; border:1px solid var(--line); border-radius:20px; background:#fafbfc; color:var(--sub); cursor:pointer; transition:.12s;}
  .chip:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .chip.work{border-color:#d8c3a0; color:#8a6416;}
  .chip.work:hover{border-color:#b26a15; color:#b26a15; background:#f9efdf;}
  .chip-grp{font-size:10px; font-weight:800; color:var(--sub); align-self:center; margin-right:2px; letter-spacing:.3px;}

  /* item search dropdown */
  .lookup{position:relative;}
  .lookup .menu{position:absolute; z-index:30; left:0; right:0; top:calc(100% + 3px); background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); max-height:240px; overflow-y:auto;}
  .lookup .menu-head{font-size:10px; font-weight:700; color:var(--sub); padding:6px 9px 3px; text-transform:uppercase; letter-spacing:.4px; background:var(--head);}
  .lookup .opt{padding:7px 9px; cursor:pointer; border-bottom:1px solid var(--line2); display:flex; flex-direction:column; gap:1px;}
  .lookup .opt:last-child{border-bottom:none;}
  .lookup .opt:hover,.lookup .opt.active{background:var(--accent-soft);}
  .lookup .opt .nm{font-size:12.5px; font-weight:600;}
  .lookup .opt .meta{font-size:10.5px; color:var(--sub); display:flex; gap:6px;}
  .lookup .opt .kind{font-size:9.5px; padding:0 5px; border-radius:8px; background:var(--head); border:1px solid var(--line2);}

  /* rows (process / bom) */
  .rowcard{border:1px solid var(--line2); border-radius:9px; padding:10px; margin-bottom:9px; background:#fcfdfe;}
  .rowcard.slim{padding:8px 10px;}
  .rowcard .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .rowcard .top .lab{font-size:11.5px; font-weight:800; color:var(--accent); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:70%;}
  .bom-row{display:flex; align-items:center; gap:8px;}
  .bom-idx{flex:none; width:22px; height:22px; border-radius:6px; background:var(--accent); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .bom-lookup{flex:1; min-width:0;}
  .bom-meta{font-size:10.5px; color:var(--sub); margin-top:3px;}
  /* --- 중국어 병기 바 (폼) --- */
  .zh-bar{display:flex; align-items:center; gap:10px; margin-top:9px; flex-wrap:wrap;}
  .zh-bar .toggle{font-size:12px; font-weight:700;}
  .tr-busy{font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:2px 8px; border-radius:20px;}
  .zh-note{font-size:10.5px; color:var(--sub);}
  .tagpick .t .t-zh{font-style:normal; font-size:9px; opacity:.7; margin-left:3px;}
  /* --- 미리보기 병기 --- */
  .sop .title .t-ko{display:inline-block;}
  .sop .title .t-zh{display:inline-block; font-size:12px; font-weight:600; color:#555; margin-left:10px;}
  .l-ko{display:block; line-height:1.25;}
  .l-zh{display:block; font-size:8.5px; color:#666; font-weight:400; line-height:1.2; margin-top:1px;}
  .val-bi{display:inline-block;}
  .val-bi .v-ko{display:block; line-height:1.3;}
  .val-bi .v-zh{display:block; font-size:9px; color:#5a6b78; line-height:1.3; white-space:pre-line; margin-top:1px;}
  .ex-head{background:#e8e8e8; font-weight:700; text-align:center; font-size:10px; border-bottom:1px solid #000; padding:2px 0;}
  .ex-grid{display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:2px; padding:2px; min-height:280px;}
  .ex-grid .imgcell{min-height:88px;}
  /* --- BOM 최하단 단독 행 그리드 (많아도 안깨짐) --- */
  .bom-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:3px 8px;}
  .bom-cell{display:flex; gap:4px; align-items:baseline; font-size:9.5px; line-height:1.35; padding:1px 0; min-width:0;}
  .bom-cell .bnum{flex:none; color:#333;}
  .bom-cell .bnm{word-break:break-word;}
  .btn.bom-load{white-space:nowrap; font-size:11px;}
  .bom-hint{font-size:11.5px; color:var(--accent); background:var(--accent-soft); border:1px solid #cfe0da; border-radius:8px; padding:8px 11px; margin-bottom:10px; line-height:1.5;}
  .bom-hint.muted{color:var(--sub); background:#f6f7f9; border-color:var(--line2);}
  .bom-name-row{display:flex; align-items:center; gap:6px;}
  .bom-kind{flex:none; font-size:10px; font-weight:800; padding:2px 6px; border-radius:5px; letter-spacing:.2px;}
  .bom-kind.pack{background:var(--accent-soft); color:var(--accent);}
  .bom-kind.raw{background:#fdf1e3; color:#b26a15;}
  .pv-kind{font-size:8px; font-weight:700; padding:0 3px; border-radius:3px; border:1px solid;}
  .pv-kind.pack{background:#eef4f2; color:#0b6b53; border-color:#cfe0da;}
  .pv-kind.raw{background:#fbf0e2; color:#b26a15; border-color:#eBD6b8;}
  .tagpick{display:flex; gap:4px;}
  .tagpick .t{font-size:10.5px; padding:2px 7px; border:1px solid var(--line); border-radius:6px; cursor:pointer; background:#fff; color:var(--sub);}
  .tagpick .t.on{background:var(--accent); border-color:var(--accent); color:#fff;}

  /* image slots */
  .imgslots{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .slot{border:1.5px dashed var(--line); border-radius:9px; aspect-ratio:4/3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; cursor:pointer; position:relative; overflow:hidden; background:#fafbfc; transition:.12s; text-align:center; padding:6px;}
  .slot:hover{border-color:var(--accent); background:var(--accent-soft);}
  .slot.drag{border-color:var(--accent); background:var(--accent-soft);}
  .slot .lab{font-size:11px; font-weight:700; color:var(--sub);}
  .slot .hint{font-size:10px; color:#98a0a8;}
  .slot.has{background:#f4f6f8; border-style:solid;}
  .slot img{position:absolute; inset:6px; width:calc(100% - 12px); height:calc(100% - 12px); object-fit:contain;}
  .slot .rm{position:absolute; top:4px; right:4px; z-index:2; background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:5px; font-size:11px; padding:2px 6px; cursor:pointer;}
  .slot .cap{position:absolute; bottom:0; left:0; right:0; background:rgba(11,107,83,.9); color:#fff; font-size:10px; font-weight:700; padding:2px 0; text-align:center; z-index:2;}

  /* export bar */
  .exportbar{position:sticky; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:12px 20px; display:flex; gap:9px; z-index:6;}
  .exportbar .btn{flex:1; justify-content:center; padding:10px;}

  /* ===== Right: preview ===== */
  .previewwrap{padding:26px; overflow:auto; height:100vh;}
  @media(max-width:1100px){ .previewwrap{height:auto;} }
  .pv-tools{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; color:var(--sub); font-size:12px; position:sticky; top:0; z-index:4;}
  .pv-left{display:flex; align-items:center; gap:8px;}
  .pv-tools .dot{width:6px; height:6px; border-radius:50%; background:var(--accent);}
  .pv-zoom{display:flex; align-items:center; gap:4px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:3px; box-shadow:var(--shadow);}
  .zbtn{width:28px; height:26px; border:none; background:transparent; border-radius:6px; font-size:15px; cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:center;}
  .zbtn:hover{background:var(--accent-soft); color:var(--accent);}
  .zbtn.wide{width:auto; padding:0 10px; font-size:12px; font-weight:700;}
  .zbtn.on{background:var(--accent); color:#fff;}
  .zlvl{font-size:12px; font-weight:700; min-width:40px; text-align:center; color:var(--ink);}
  .sheet-scale-outer{width:100%;}
  .sheet-scale{transform-origin:top left; transition:transform .1s ease;}

  /* A4 landscape sheet */
  .sheet{background:#fff; width:1123px; min-height:794px; margin:0 auto; box-shadow:var(--shadow); padding:0; color:#000; font-size:11px;}
  .sheet *{box-sizing:border-box;}
  .sop{border:1.5px solid #000; border-collapse:collapse; width:100%; table-layout:fixed;}
  .sop td,.sop th{border:1px solid #000; padding:3px 5px; vertical-align:middle; word-break:break-word;}
  .sop .title{font-size:18px; font-weight:800; text-align:center; letter-spacing:4px; padding:8px;}
  .lbl{background:#f0f0f0; font-weight:700; text-align:center; font-size:10.5px;}
  .ctr{text-align:center;} .lft{text-align:left;}
  .warn-cell{white-space:pre-line; text-align:left; font-size:10px; line-height:1.45; vertical-align:top;}
  .proc-head td{background:#e8e8e8; font-weight:700; text-align:center; font-size:11px;}
  .proc-content{white-space:pre-line; text-align:left; line-height:1.4;}
  .subtag{display:inline-block; font-size:9.5px; background:#eef4f2; border:1px solid #cfe0da; border-radius:3px; padding:0 4px; margin-right:4px; color:#0b6b53; font-weight:700;}
  .imgcell{padding:0; height:118px; position:relative; text-align:center;}
  .imgcell img{max-width:100%; max-height:100%; object-fit:contain;}
  .imgcell .ph{color:#bbb; font-size:10px; height:100%; display:flex; align-items:center; justify-content:center;}
  .imgcell .cp{position:absolute; top:0; left:0; right:0; background:#f0f0f0; font-size:9px; font-weight:700; border-bottom:1px solid #000; padding:1px;}
  .bom-lbl{background:#333; color:#fff; font-weight:800; text-align:center;}
  .empty-hint{color:#c00; font-style:italic;}

  @media print{
    html,body{background:#fff !important; margin:0 !important; padding:0 !important;}
    /* 화면 전용 요소 전부 숨김 */
    .panel, .pv-tools, .mobile-tabs, .exportbar, .toast{ display:none !important; }
    /* 레이아웃 컨테이너 평탄화 */
    .app, .app.tab-form, .app.tab-preview{ display:block !important; }
    .previewwrap{ display:block !important; padding:0 !important; margin:0 !important; height:auto !important; overflow:visible !important; position:static !important; }
    .sheet-scale-outer{ width:auto !important; }
    /* 줌 스케일 제거 → 원본 크기로 인쇄 */
    .sheet-scale{ transform:none !important; width:auto !important; }
    .sheet{ box-shadow:none !important; width:277mm !important; max-width:277mm !important; min-height:0 !important; height:auto !important; margin:0 !important; overflow:hidden !important; }
    .sop{ width:100% !important; font-size:10px !important; }
    .sop .title{ font-size:15px !important; padding:5px !important; }
    /* 예시도 인쇄 높이 축소 (세로 넘침 방지) */
    .ex-grid{ min-height:0 !important; }
    .ex-grid .imgcell{ min-height:62px !important; }
    .imgcell{ height:auto !important; }
    /* 표가 페이지 넘어갈 때 잘림 방지 */
    .sop tr, .sop td{ page-break-inside:avoid; }
    /* 마지막 요소 뒤 여백이 새 페이지를 만들지 않도록 */
    .sheet, .previewwrap, .sheet-scale, .sheet-scale-outer{ page-break-after:avoid !important; page-break-inside:avoid !important; }
    @page{ size:A4 landscape; margin:6mm; }
  }
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1a1d21; color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; z-index:100; box-shadow:var(--shadow);}
</style>
</head>

// ---------- 품목 검색 드롭다운 ----------
function ItemLookup({ value, onPick, placeholder, kinds }) {
  const [q, setQ] = useState(value || "");
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState(0);
  const ref = useRef(null);
  useEffect(() => { setQ(value || ""); }, [value]);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);
  const recents = window.__recentItems || (window.__recentItems = []);
  const results = useMemo(() => {
    const s = q.trim().toLowerCase();
    let pool = window.ITEMS;
    if (kinds) pool = pool.filter(i => kinds.includes(i.k));
    if (!s) {
      const r = recents.filter(i => !kinds || kinds.includes(i.k));
      return r.slice(0, 8);
    }
    return pool.filter(i =>
      i.n.toLowerCase().includes(s) || i.c.toLowerCase().includes(s)
    ).slice(0, 40);
  }, [q, kinds, open]);
  const pick = (it) => {
    onPick({ name: it.n, code: it.c, spec: it.s });
    setQ(it.n); setOpen(false);
    const arr = window.__recentItems;
    const idx = arr.findIndex(x => x.c === it.c);
    if (idx >= 0) arr.splice(idx, 1);
    arr.unshift(it);
    if (arr.length > 12) arr.pop();
  };
  return (
    <div className="lookup" ref={ref}>
      <input type="text" value={q} placeholder={placeholder}
        onChange={e => { setQ(e.target.value); setOpen(true); setActive(0); onPick({ name: e.target.value, code: "", spec: "" }, true); }}
        onFocus={() => setOpen(true)}
        onKeyDown={e => {
          if (!open || !results.length) return;
          if (e.key === "ArrowDown") { e.preventDefault(); setActive(a => Math.min(a + 1, results.length - 1)); }
          else if (e.key === "ArrowUp") { e.preventDefault(); setActive(a => Math.max(a - 1, 0)); }
          else if (e.key === "Enter") { e.preventDefault(); const it = results[active]; if (it) pick(it); }
          else if (e.key === "Escape") setOpen(false);
        }} />
      {open && results.length > 0 && (
        <div className="menu">
          {!q.trim() && <div className="menu-head">최근 선택</div>}
          {results.map((it, i) => (
            <div key={it.c} className={"opt" + (i === active ? " active" : "")}
              onMouseEnter={() => setActive(i)}
              onMouseDown={() => pick(it)}>
              <span className="nm">{it.n}</span>
              <span className="meta"><span className="kind">{it.k}</span><span>{it.c}</span>{it.s && <span>· {it.s}</span>}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

        });
        const data = await res.json();
        const txt = data.content.filter(x => x.type === "text").map(x => x.text).join("").replace(/```json|```/g, "").trim();
        const arr = JSON.parse(txt);
        setTrCache(prev => { const n = { ...prev }; list.forEach((k, i) => { if (arr[i]) n[k] = arr[i]; }); return n; });
      } catch (e) { /* 오프라인·오류 시 조용히 스킵 */ }

    if (dirty && !window.confirm("저장하지 않은 변경사항이 있습니다. 현재 내용을 복제해 새 문서로 이어서 작성할까요?")) return;
    setH(s => ({ ...s, docno: "", rev: "A/01" }));
    setDirty(true);
    showToast("현재 내용을 복제했습니다. 문서번호를 새로 입력하세요");
  };
  const resetAll = () => {
    if (dirty && !window.confirm("저장하지 않은 변경사항이 있습니다. 모두 지우고 새로 시작할까요?")) return;
    setH(emptyHeader()); setProcs(sampleProcs()); setBom([{ name: "", code: "", spec: "", kind: "" }]);
    setImgs([null, null, null, null, null]); setDirty(false);
    showToast("새 문서를 시작합니다");
  };

  const zoomIn = () => { setFit(false); setZoom(z => Math.min(z + 0.1, 1.6)); };
  const zoomOut = () => { setFit(false); setZoom(z => Math.max(z - 0.1, 0.4)); };
  const fitToScreen = () => { setFit(true); };
  useEffect(() => {
    if (!fit) return;
    const calc = () => {
      const w = previewWrapRef.current ? previewWrapRef.current.clientWidth - 52 : 1123;
      setZoom(Math.min(1, w / 1123));
    };
    calc();
    window.addEventListener("resize", calc);
    return () => window.removeEventListener("resize", calc);
  }, [fit]);

  const confirmExport = (fn) => {
    if (missing.length && !window.confirm(`다음 필수 항목이 비어 있습니다:\n· ${missing.join("\n· ")}\n\n그래도 내보낼까요?`)) return;
    fn();
  };

  const exportExcel = async () => {
    try {
      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet(h.product || "작업표준서", { properties: { defaultRowHeight: 18 }, pageSetup: { orientation: "landscape", fitToPage: true, fitToWidth: 1 } });
      for (let c = 1; c <= 29; c++) ws.getColumn(c).width = 4.2;
      const border = { top: { style: "thin" }, left: { style: "thin" }, bottom: { style: "thin" }, right: { style: "thin" } };
      const setCell = (addr, val, opts = {}) => {
        const cell = ws.getCell(addr); cell.value = val;
        cell.font = { name: "맑은 고딕", size: opts.size || 10, bold: !!opts.bold, color: opts.color ? { argb: opts.color } : undefined };
        cell.alignment = { vertical: "middle", horizontal: opts.h || "center", wrapText: opts.wrap !== false };
        cell.border = border;
        if (opts.fill) cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: opts.fill } };
      };
      // 라벨 병기: "한국어 / 中文"
      const lbl = (addr, ko, opts = {}) => setCell(addr, zhOn && tz(ko) ? `${ko}\n${tz(ko)}` : ko, { ...opts, wrap: true });
      // 값 병기: 자유입력 원문 + 번역(줄바꿈)
      const valbi = (addr, text, opts = {}) => {
        const zh = zhOn ? zof(text) : "";
        setCell(addr, zh ? `${text}\n${zh}` : (text || ""), { ...opts, wrap: true });
      };
      ws.mergeCells("A1:AC1");
      setCell("A1", zhOn ? "작업지도서 (SOP)  /  作业指导书 (SOP)" : "작업지도서 (SOP)", { size: 16, bold: true }); ws.getRow(1).height = 26;
      ws.mergeCells("A2:E2"); setCell("A2", "문서번호: " + h.docno, { h: "left", bold: true });
      ws.mergeCells("F2:T2"); setCell("F2", "");
      ws.mergeCells("U2:V2"); setCell("U2", "작성일:", { bold: true });
      ws.mergeCells("W2:Y2"); setCell("W2", h.date);
      ws.mergeCells("Z2:AA2"); setCell("Z2", "Rev:", { bold: true });
      ws.mergeCells("AB2:AC2"); setCell("AB2", h.rev);
      ws.mergeCells("A3:C3"); lbl("A3", "작업명", { fill: "FFF0F0F0", bold: true });
      ws.mergeCells("D3:I3"); valbi("D3", h.work, { h: "left" });
      ws.mergeCells("J3:L3"); lbl("J3", "인원배치", { fill: "FFF0F0F0", bold: true });
      ws.mergeCells("M3:N3"); setCell("M3", h.staff);
      ws.mergeCells("O3:Q3"); lbl("O3", "표준생산량", { fill: "FFF0F0F0", bold: true });
      ws.mergeCells("R3:S3"); setCell("R3", h.stdqty);
      ws.mergeCells("T3:U5"); lbl("T3", "주의사항", { fill: "FFF0F0F0", bold: true });
      ws.mergeCells("V3:AC5"); valbi("V3", h.warn, { h: "left", size: 9 });
      ws.mergeCells("A4:C4"); lbl("A4", "제품명/모델명", { fill: "FFF0F0F0", bold: true });
      ws.mergeCells("D4:I4"); valbi("D4", h.product + (h.productSpec ? " " + h.productSpec : ""));
      ws.mergeCells("J4:L4"); lbl("J4", "포장재명/모델명", { fill: "FFF0F0F0", bold: true });
      ws.mergeCells("M4:N4"); valbi("M4", h.pack);
      ws.mergeCells("O4:Q4"); lbl("O4", "규격", { fill: "FFF0F0F0", bold: true });
      ws.mergeCells("R4:S4"); setCell("R4", h.spec);
      ws.mergeCells("A5:C5"); lbl("A5", "설비 및 공치구", { fill: "FFF0F0F0", bold: true });
      ws.mergeCells("D5:S5"); valbi("D5", h.equip, { h: "left" });
      // 병합 셀 폭(열 수)과 텍스트로 필요한 행 높이(pt) 추정
      const estRowHeight = (text, colCount, fontSize = 10) => {
        if (!text) return 22;
        // 한 열(width 3.6) ≈ 문자 3.6개 폭, 한자·한글은 폭 2배로 계산
        const charsPerLine = Math.max(6, colCount * 3.4 / (fontSize >= 10 ? 1.5 : 1.3));
        let lines = 0;
        String(text).split("\n").forEach(seg => {
          const w = [...seg].reduce((a, ch) => a + (/[\x00-\xff]/.test(ch) ? 1 : 2), 0) / 2;
          lines += Math.max(1, Math.ceil(w / charsPerLine));
        });
        return Math.max(22, lines * (fontSize >= 10 ? 15 : 13.5) + 8);
      };
      // 헤더 정보 행(3,4) 높이 — 값 병기로 2줄 이상 될 수 있음
      [3, 4, 5].forEach(rn => {
        const texts = [];
        if (rn === 3) { texts.push(h.work, h.warn); }
        if (rn === 4) { texts.push(h.product + (h.productSpec || ""), h.pack); }
        if (rn === 5) { texts.push(h.equip); }
        let maxH = zhOn ? 34 : 22;
        texts.forEach(t => { maxH = Math.max(maxH, estRowHeight(t, 6, 10)); });
        // 주의사항은 T3:AC5 세로 병합(3줄분)이라 별도 반영
        ws.getRow(rn).height = Math.min(maxH, rn === 3 ? 60 : 48);
      });

      const ph = 6;
      setCell(`A${ph}`, "No.", { fill: "FFE8E8E8", bold: true });
      ws.mergeCells(`B${ph}:D${ph}`); lbl(`B${ph}`, "작업순서", { fill: "FFE8E8E8", bold: true });
      ws.mergeCells(`E${ph}:F${ph}`); lbl(`E${ph}`, "구분", { fill: "FFE8E8E8", bold: true });
      ws.mergeCells(`G${ph}:N${ph}`); lbl(`G${ph}`, "작업표준 및 검사", { fill: "FFE8E8E8", bold: true });
      ws.mergeCells(`O${ph}:AC${ph}`); lbl(`O${ph}`, "작업 예시도", { fill: "FFE8E8E8", bold: true });
      let r = ph + 1;
      procs.forEach(p => {
        // 내용(G:N 8칸)과 작업순서(B:D 3칸)의 병기 텍스트로 필요한 높이 계산
        const contentText = zhOn ? (p.content + "\n" + (zof(p.content) || "")) : p.content;
        const orderText = zhOn ? (p.order + "\n" + (zof(p.order) || "")) : p.order;
        const hC = estRowHeight(contentText, 8, 9);
        const hO = estRowHeight(orderText, 3, 10);
        ws.getRow(r).height = Math.min(Math.max(hC, hO, zhOn ? 30 : 22), 120);
        setCell(`A${r}`, p.no);
        ws.mergeCells(`B${r}:D${r}`); valbi(`B${r}`, p.order, { h: "left" });
        ws.mergeCells(`E${r}:F${r}`); setCell(`E${r}`, p.sub ? (zhOn && tz(p.sub) ? `${p.sub}\n${tz(p.sub)}` : p.sub) : "", { wrap: true });
        ws.mergeCells(`G${r}:N${r}`); valbi(`G${r}`, p.content, { h: "left", size: 9 });
        r++;
      });
      let imgRow = r + 1;
      ws.mergeCells(`A${imgRow}:AC${imgRow}`); setCell(`A${imgRow}`, zhOn ? "■ 작업 예시도 / 作业示例图" : "■ 작업 예시도", { fill: "FFF0F0F0", bold: true, h: "left" });
      imgRow++;
      const labelRow = imgRow;
      const spans = [[1, 6], [7, 12], [13, 18], [19, 23], [24, 29]];
      spans.forEach((sp, i) => {
        const c1 = ws.getColumn(sp[0]).letter, c2 = ws.getColumn(sp[1]).letter;
        ws.mergeCells(`${c1}${labelRow}:${c2}${labelRow}`);
        setCell(`${c1}${labelRow}`, zhOn && tz(IMG_LABELS[i]) ? `${IMG_LABELS[i]} / ${tz(IMG_LABELS[i])}` : IMG_LABELS[i], { fill: "FFEEF4F2", bold: true, size: 9 });
      });
      const picRow = labelRow + 1;
      for (let k = picRow; k < picRow + 6; k++) ws.getRow(k).height = 20;
      spans.forEach((sp, i) => {
        const c1 = ws.getColumn(sp[0]).letter;
        ws.mergeCells(`${c1}${picRow}:${ws.getColumn(sp[1]).letter}${picRow + 5}`);
        ws.getCell(`${c1}${picRow}`).border = border;
        if (imgs[i]) {
          const ext = imgs[i].substring(11, imgs[i].indexOf(";"));
          const imgId = wb.addImage({ base64: imgs[i], extension: (ext === "jpeg" ? "jpeg" : "png") });
          ws.addImage(imgId, { tl: { col: sp[0] - 1, row: picRow - 1 }, br: { col: sp[1], row: picRow + 5 }, editAs: "oneCell" });
        }
      });
      let bomRow = picRow + 6 + 1;
      const bomItems = bom.filter(b => b.name);
      const perRow = 4;                         // 한 줄 4개(폭 여유 확보)
      const bomLines = Math.max(1, Math.ceil(bomItems.length / perRow));
      ws.mergeCells(`A${bomRow}:A${bomRow + bomLines - 1}`);
      setCell(`A${bomRow}`, "BOM", { fill: "FF333333", color: "FFFFFFFF", bold: true });
      const rowMaxLen = {};
      bomItems.forEach((b, idx) => {
        const rr = bomRow + Math.floor(idx / perRow);
        const tag = b.kind === "pack" ? (zhOn ? "[辅料] " : "[부] ") : b.kind === "raw" ? (zhOn ? "[原料] " : "[원] ") : "";
        const txt = tag + b.name + (b.spec ? ` (${b.spec})` : "");
        const w = [...txt].reduce((a, ch) => a + (/[\x00-\xff]/.test(ch) ? 1 : 2), 0);
        rowMaxLen[rr] = Math.max(rowMaxLen[rr] || 0, w);
        const colStart = 2 + (idx % perRow) * 7; // 번호1 + 내용6 = 7칸 간격
        const c1 = ws.getColumn(colStart).letter;
        const nc = ws.getCell(`${c1}${rr}`); nc.value = idx + 1;
        nc.font = { name: "맑은 고딕", size: 9, bold: true }; nc.border = border; nc.alignment = { horizontal: "center", vertical: "middle" };
        ws.mergeCells(`${ws.getColumn(colStart + 1).letter}${rr}:${ws.getColumn(colStart + 6).letter}${rr}`);
        const bc = ws.getCell(`${ws.getColumn(colStart + 1).letter}${rr}`);
        bc.value = txt;
        bc.font = { name: "맑은 고딕", size: 9 }; bc.border = border; bc.alignment = { horizontal: "left", vertical: "middle", wrapText: true };
      });
      for (let li = 0; li < bomLines; li++) {
        const rr = bomRow + li;
        const w = rowMaxLen[rr] || 10;
        const lines = Math.max(1, Math.ceil((w / 2) / 20));  // 내용 6칸 ≈ 20자
        ws.getRow(rr).height = Math.max(20, lines * 14 + 6);
      }
      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = `작업표준서_${h.product || "무제"}_${h.date}.xlsx`; a.click();
      showToast("Excel 파일을 내보냈습니다");
    } catch (e) { console.error(e); showToast("Excel 내보내기 오류: " + e.message); }
  };

  const exportPDF = () => {
    // 모바일에서 폼 탭이면 미리보기로 전환(인쇄 대상 노출), 인쇄 후 원복
    const prevTab = mobileTab;

    setTimeout(() => {
      window.print();
      // 인쇄 대화상자 종료 후 원래 탭 복원
      setTimeout(() => setMobileTab(prevTab), 300);

  };

  // 값(자유입력) 병기 셀 — 한국어 위, 중국어 아래(옅게)
  const V = ({ text, empty }) => {

  // 라벨 병기 (사전 기반)
  const L = ({ ko }) => (<><span className="l-ko">{ko}</span>{zhOn && tz(ko) && <span className="l-zh">{tz(ko)}</span>}</>);

  const Preview = () => (

        <tbody>

            <span className="t-ko">작업지도서 (SOP)</span>{zhOn && <span className="t-zh">作业指导书 (SOP)</span>}
          </td></tr>
          <tr>
            <td className="lbl lft" colSpan={9}><L ko="문서번호" />: {h.docno || <span className="empty-hint">{tz("미입력")}</span>}</td>
            <td colSpan={10}></td>

            <td colSpan={10} rowSpan={procs.length + 1} style={{ verticalAlign: "top" }}>

        <div className="grid3">
          <div className="field"><label>작업명 <b className="req">*</b></label><input className={!h.work ? "warn-empty" : ""} type="text" value={h.work} onChange={e => upH("work", e.target.value)} placeholder="예: 글루 충진/포장" /></div>
          <div className="field"><label>인원배치</label><input type="text" value={h.staff} onChange={e => upH("staff", e.target.value)} /></div>
          <div className="field"><label>표준생산량</label><input type="text" value={h.stdqty} onChange={e => upH("stdqty", e.target.value)} placeholder="예: 2020" /></div>
        </div>
      </div>

      <div className="sect">
        <h2><span className="n">2</span> 제품 / 포장재</h2>
        <div className="field"><label>제품명 / 모델명 (품목 검색) <b className="req">*</b></label>
          <ItemLookup value={h.product} placeholder="제품명·코드 검색" kinds={["제품", "반제품", "상품"]}
            onPick={(it) => { setH(s => ({ ...s, product: it.name, productCode: it.code, productSpec: it.spec })); markDirty(); }} />
        </div>
        <div className="grid2">
          <div className="field"><label>포장재명 / 모델명</label>
            <ItemLookup value={h.pack} placeholder="포장재 검색" kinds={["부재료", "원재료"]}
              onPick={(it) => { setH(s => ({ ...s, pack: it.name, packCode: it.code })); markDirty(); }} />
          </div>
          <div className="field"><label>규격</label><input type="text" value={h.spec} onChange={e => upH("spec", e.target.value)} placeholder="예: 5g" /></div>
        </div>
        <div className="field full"><label>설비 및 공치구</label><input type="text" value={h.equip} onChange={e => upH("equip", e.target.value)} placeholder="사용 설비/지그" /></div>
        <div className="field full"><label>주의사항</label>
          <textarea value={h.warn} onChange={e => upH("warn", e.target.value)} placeholder="줄바꿈으로 항목 구분" />
          <div className="chips">{PRESET_WARN.map(w => (
            <span key={w} className="chip" onClick={() => upH("warn", h.warn ? h.warn + "\n" + w : w)}>+ {w}</span>
          ))}</div>
        </div>
      </div>

      <div className="sect">
        <div className="sect-head">
          <h2><span className="n">3</span> 작업 순서</h2>
          <label className="toggle"><input type="checkbox" checked={autoNo} onChange={e => setAutoNo(e.target.checked)} /> No. 자동</label>
        </div>
        {procs.map((p, i) => (
          <div className="rowcard" key={i}>
            <div className="top">
              <span className="lab">{p.no ? `${p.no}.` : "─"} {p.order || "작업"}</span>
              <div className="rowbtns">
                <button className="btn xs" disabled={i === 0} onClick={() => moveProc(i, -1)} title="위로">↑</button>
                <button className="btn xs" disabled={i === procs.length - 1} onClick={() => moveProc(i, 1)} title="아래로">↓</button>
                <button className="btn xs danger" onClick={() => rmProc(i)} title="삭제">✕</button>
              </div>
            </div>
            <div className="grid2">
              <div className="field"><label>No. {autoNo && <span className="mini">(자동)</span>}</label><input type="text" value={p.no} disabled={autoNo} onChange={e => upProc(i, "no", e.target.value)} placeholder="1" /></div>
              <div className="field"><label>작업순서</label><input type="text" value={p.order} onChange={e => upProc(i, "order", e.target.value)} placeholder="작업전 준비" /></div>
            </div>
            <div className="field"><label>구분</label>
              <div className="tagpick">{SUBTAGS.map(t => (
                <span key={t} className={"t" + (p.sub === t ? " on" : "")} onClick={() => upProc(i, "sub", p.sub === t ? "" : t)}>{t}{zhOn && tz(t) ? <em className="t-zh">{tz(t)}</em> : ""}</span>
              ))}</div>
            </div>
            <div className="field"><label>작업표준 및 검사</label>
              <textarea value={p.content} onChange={e => upProc(i, "content", e.target.value)} placeholder="작업 내용 / 검사 기준" />
              <div className="chips">
                <span className="chip-grp">공정</span>
                {PRESET_WORK.map(w => (
                  <span key={w} className="chip work" onClick={() => upProc(i, "content", p.content ? p.content + "\n" + w : w)}>+ {w.length > 14 ? w.slice(0, 14) + "…" : w}</span>
                ))}
              </div>
              <div className="chips">
                <span className="chip-grp">검사</span>
                {PRESET_INSPECT.map(w => (
                  <span key={w} className="chip" onClick={() => upProc(i, "content", p.content ? p.content + "\n" + w : w)}>+ {w}</span>
                ))}
              </div>
            </div>
          </div>
        ))}
        <button className="btn ghost" onClick={addProc}>+ 작업 순서 추가</button>
      </div>

      <div className="sect">
        <div className="sect-head">
          <h2><span className="n">4</span> BOM (부자재)</h2>
          {h.productCode && bomAvailable > 0 && (
            <button className="btn sm pri bom-load" onClick={loadBom} title="선택한 제품의 등록 BOM을 불러옵니다">
              ⭳ 제품 BOM 불러오기 ({bomAvailable})
            </button>
          )}
        </div>
        {h.product && !h.productCode && (
          <div className="bom-hint">품목 검색에서 제품을 <b>목록에서 선택</b>하면 등록된 BOM을 불러올 수 있어요.</div>
        )}
        {h.productCode && bomAvailable === 0 && (
          <div className="bom-hint muted">이 제품({h.productCode})은 등록된 BOM 정보가 없습니다. 아래에서 직접 입력하세요.</div>
        )}
        {bom.map((b, i) => (
          <div className="rowcard slim" key={i}>
            <div className="bom-row">
              <span className="bom-idx">{i + 1}</span>
              <div className="bom-lookup">
                <div className="bom-name-row">
                  {b.kind && <span className={"bom-kind " + b.kind}>{b.kind === "pack" ? "부자재" : "원료"}</span>}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <ItemLookup value={b.name} placeholder="캡·용기·노즐 등 검색"
                      onPick={(it) => upBom(i, { name: it.name, code: it.code, spec: it.spec })} />
                  </div>
                </div>
                {b.code && <div className="bom-meta">코드 {b.code}{b.spec ? ` · 규격 ${b.spec}` : ""}</div>}
              </div>
              <button className="btn xs danger" onClick={() => rmBom(i)} title="삭제">✕</button>
            </div>
          </div>
        ))}
        {bom.length < 25 && <button className="btn ghost" onClick={addBom}>+ 부자재 추가 (최대 25)</button>}
      </div>

      <div className="sect">
        <h2><span className="n">5</span> 작업 예시도 (사진)</h2>
        <div className="imgslots">
          {IMG_LABELS.map((lab, i) => (
            <ImgSlot key={i} label={lab} data={imgs[i]} onFile={f => setImg(i, f)} onClear={() => clearImg(i)} />
          ))}
        </div>
      </div>

      <div className="exportbar">
        <button className="btn" onClick={() => confirmExport(exportPDF)}>📄 PDF</button>
        <button className="btn pri" onClick={() => confirmExport(exportExcel)}>📊 Excel</button>
      </div>
    </div>
  );

  return (
    <div className={"app tab-" + mobileTab}>
      <div className="mobile-tabs">
        <button className={mobileTab === "form" ? "on" : ""} onClick={() => setMobileTab("form")}>✏️ 입력</button>
        <button className={mobileTab === "preview" ? "on" : ""} onClick={() => setMobileTab("preview")}>👁 미리보기</button>
      </div>
      {formPane}
      {previewPane}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function ImgSlot({ label, data, onFile, onClear }) {
  const [drag, setDrag] = useState(false);
  const ref = useRef();
  return (
    <div className={"slot" + (drag ? " drag" : "") + (data ? " has" : "")}
      onClick={() => ref.current.click()}
      onDragOver={e => { e.preventDefault(); setDrag(true); }}
      onDragLeave={() => setDrag(false)}
      onDrop={e => { e.preventDefault(); setDrag(false); const f = e.dataTransfer.files[0]; if (f) onFile(f); }}>
      {data ? <>
        <img src={data} alt={label} />
        <button className="rm" onClick={e => { e.stopPropagation(); onClear(); }}>✕</button>
        <div className="cap">{label}</div>
      </> : <>
        <div className="lab">{label}</div>
        <div className="hint">클릭·드래그로 사진 추가</div>
      </>}
      <input ref={ref} type="file" accept="image/*" style={{ display: "none" }}
        onChange={e => { const f = e.target.files[0]; if (f) onFile(f); e.target.value = ""; }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
